name: QuickMD

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: true
    ENABLE_USER_SCRIPT_SANDBOXING: false
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  MarkdownCore:
    type: library.static
    platform: macOS
    sources:
      - MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bunn.quickmd.markdown-core

  MarkdownPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - MarkdownPreviewExtension
    dependencies:
      - target: MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bunn.quickmd.preview
        PRODUCT_NAME: Markdown Preview
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MarkdownPreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MarkdownPreviewExtension/MarkdownPreviewExtension.entitlements
        SKIP_INSTALL: true

  QuickMD:
    type: application
    platform: macOS
    sources:
      - QuickMD
    dependencies:
      - target: MarkdownPreviewExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bunn.quickmd
        PRODUCT_NAME: QuickMD
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: QuickMD/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickMD/QuickMD.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1

  QuickMDTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bunn.quickmd.tests

schemes:
  QuickMD:
    build:
      targets:
        QuickMD: all
        MarkdownPreviewExtension: all
        MarkdownCore: all
        QuickMDTests: [test]
    test:
      targets:
        - QuickMDTests
